spring.application.name=taller

# Perfil activo (dev para desarrollo, prod para produccion)
spring.profiles.active=dev

# MongoDB Configuration
spring.data.mongodb.uri=mongodb://localhost:27017/taller_financiero
spring.data.mongodb.auto-index-creation=true

# Server Configuration
server.port=8080

# Logging Configuration - Balanceado para produccion
logging.level.root=INFO
logging.level.co.edu.uptc.taller=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Performance Tuning - Optimizado para 5000 usuarios concurrentes
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000

# Connection Pool - Optimizado para alta concurrencia
spring.data.mongodb.max-pool-size=100
spring.data.mongodb.min-pool-size=10

# Jackson Configuration - Para mejor rendimiento en serialización JSON
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Validation Configuration
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=true
