<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Transacciones Financieras</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Sistema de Transacciones Financieras</h1>
            <div id="authSection">
                <input type="text" id="username" placeholder="Usuario">
                <input type="password" id="password" placeholder="Contraseña">
                <button onclick="login()">Iniciar Sesión</button>
                <span id="authStatus"></span>
            </div>
        </header>

        <div class="content" id="mainContent" style="display: none;">
            <div class="tabs">
                <button class="tab-button active" onclick="showTab('accounts')">Cuentas</button>
                <button class="tab-button" onclick="showTab('transactions')">Transacciones</button>
                <button class="tab-button" onclick="showTab('reports')">Reportes</button>
            </div>

            <!-- Tab: Cuentas -->
            <div id="accountsTab" class="tab-content active">
                <h2>Gestión de Cuentas</h2>
                
                <div class="section">
                    <h3>Crear Nueva Cuenta</h3>
                    <form id="createAccountForm" onsubmit="createAccount(event)">
                        <input type="text" id="accountUserId" placeholder="User ID" required>
                        <input type="number" id="initialBalance" placeholder="Saldo Inicial" step="0.01" required>
                        <input type="text" id="currency" placeholder="Moneda (COP)" value="COP">
                        <button type="submit">Crear Cuenta</button>
                    </form>
                </div>

                <div class="section">
                    <h3>Consultar Cuenta</h3>
                    <input type="text" id="accountIdQuery" placeholder="Account ID">
                    <button onclick="getAccount()">Buscar</button>
                    <div id="accountDetails"></div>
                </div>
            </div>

            <!-- Tab: Transacciones -->
            <div id="transactionsTab" class="tab-content">
                <h2>Procesamiento de Transacciones</h2>
                
                <div class="section">
                    <h3>Nueva Transacción</h3>
                    <form id="createTransactionForm" onsubmit="createTransaction(event)">
                        <input type="text" id="transUserId" placeholder="User ID" required>
                        <input type="text" id="transAccountId" placeholder="Account ID" required>
                        <input type="number" id="amount" placeholder="Monto" step="0.01" required>
                        <select id="transactionType" required>
                            <option value="">Seleccione tipo...</option>
                            <option value="TRANSFER">Transferencia</option>
                            <option value="DEPOSIT">Depósito</option>
                            <option value="WITHDRAWAL">Retiro</option>
                            <option value="PAYMENT">Pago</option>
                        </select>
                        <input type="text" id="description" placeholder="Descripción">
                        <button type="submit">Procesar Transacción</button>
                    </form>
                </div>

                <div class="section">
                    <h3>Consultar Transacciones</h3>
                    <div>
                        <input type="text" id="transQueryUserId" placeholder="User ID">
                        <button onclick="getTransactionsByUser()">Por Usuario</button>
                    </div>
                    <div>
                        <input type="text" id="transQueryAccountId" placeholder="Account ID">
                        <button onclick="getTransactionsByAccount()">Por Cuenta</button>
                    </div>
                    <div id="transactionsList"></div>
                </div>
            </div>

            <!-- Tab: Reportes -->
            <div id="reportsTab" class="tab-content">
                <h2>Reportes y Estadísticas</h2>
                
                <div class="section">
                    <h3>Resumen por Usuario</h3>
                    <input type="text" id="reportUserId" placeholder="User ID">
                    <button onclick="getUserSummary()">Generar Resumen</button>
                    <div id="userSummary"></div>
                </div>

                <div class="section">
                    <h3>Resumen por Cuenta</h3>
                    <input type="text" id="reportAccountId" placeholder="Account ID">
                    <button onclick="getAccountSummary()">Generar Resumen</button>
                    <div id="accountSummary"></div>
                </div>
            </div>
        </div>

        <div id="messageBox" class="message-box"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
