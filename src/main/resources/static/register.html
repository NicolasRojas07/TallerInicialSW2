<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Transacciones Financieras</title>
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <div class="register-header">
                <h1>Crear Cuenta</h1>
                <p>Sistema de Transacciones Financieras</p>
            </div>

            <form id="registerForm" class="register-form">
                <div class="form-group">
                    <label for="username">Nombre de Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        required
                        minlength="4"
                        maxlength="50"
                        placeholder="Ingrese su nombre de usuario"
                    >
                    <small class="help-text">Mínimo 4 caracteres</small>
                    <span class="validation-message" id="usernameValidation"></span>
                </div>

                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        placeholder="correo@ejemplo.com"
                    >
                    <span class="validation-message" id="emailValidation"></span>
                </div>

                <div class="form-group">
                    <label for="fullName">Nombre Completo</label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        required
                        minlength="2"
                        maxlength="100"
                        placeholder="Ingrese su nombre completo"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        minlength="6"
                        placeholder="Mínimo 6 caracteres"
                    >
                    <small class="help-text">Mínimo 6 caracteres</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar Contraseña</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        required
                        minlength="6"
                        placeholder="Repita su contraseña"
                    >
                    <span class="validation-message" id="passwordMatch"></span>
                </div>

                <button type="submit" class="btn-register" id="registerBtn">
                    Crear Cuenta
                </button>

                <div class="form-footer">
                    <p>¿Ya tienes una cuenta? <a href="/">Inicia Sesión</a></p>
                </div>
            </form>

            <div id="messageBox" class="message-box"></div>
        </div>
    </div>

    <script src="register.js"></script>
</body>
</html>
